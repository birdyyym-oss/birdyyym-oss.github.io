  <em>The Sacred Word in Translation: Discourse Analysis of Ani’s Oral Narrative</em> Presented at the 8th International Symposium on Chinese Language and Discourse in Madrid, Spain (June 2026). This study examines the oral narrative traditions of King Gesar, focusing on the cross-linguistic expression and cultural transmission of sacred oral performance.
    
