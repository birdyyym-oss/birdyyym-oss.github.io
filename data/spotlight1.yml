title : "The Accordion Years"
content: |
  <p>From 2020 to 2024, Yimeng completed her undergraduate studies, during which she received systematic training in music performance, establishing a strong foundation in accordion and piano. This instrumental training equipped her with direct experience in performance practice, allowing her to later bridge the gap between rigorous musical technique and interdisciplinary art theory.</p>
    Check the buttons below, you can listen to her solo and duet accordion performances.
  
