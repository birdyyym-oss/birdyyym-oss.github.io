      <h3 style="color: #222; margin-bottom: 1em;">The Sacred Word in Translation: Discourse Analysis of Ani’s Oral Narrative</h3>
      
      <p>This presentation focuses on the Mandarin oral narratives of Ani, a national-level representative inheritor of the Gesar singing tradition from Dege, Garzê. It explores how the Epic of King Gesar is expressed within contemporary field interviews, intangible cultural heritage preservation, and academic research. Rather than viewing Ani’s Mandarin accounts as simple linguistic translation, the talk highlights how he re-explains story details, performance techniques, and his personal journey of lineage transmission when introducing Gesar singing to outside audiences.</p>
      <p>Drawing directly on field interviews and oral material, the research examines hero stories, character relationships, vocal styles, performance practices, and transmission history. Here, "translation" is understood as a broader process: how Ani's oral experience is spoken, explained, organized, and shared in Mandarin.</p>

      <p>Through analyzing transcript fragments and field notes, the presentation highlights three key roles of Mandarin narration in sharing the Gesar epic:</p>

   <ul>
      <li><strong>Clarity:</strong> It helps outside audiences easily grasp character dynamics, plotlines, and key narrative events.</li>
      <li><strong>Vivid World-Building:</strong> Detailed descriptions of characters, attire, weaponry, and battle scenes offer listeners a direct window into the epic’s artistic universe.</li>
      <li><strong>Documenting Performance:</strong> It translates non-verbal elements—vocal tone, rhythm, movement, and prop usage—into accessible written records.</li>
    </ul>

    <p>Ultimately, Ani’s Mandarin accounts do not replace traditional Tibetan oral performance; instead, they serve as a vital bridge for contemporary research and outreach. By articulating these stories in Mandarin, the Gesar tradition reaches wider audiences while bringing lived performance experience into fieldwork records and academic discourse.Modern heritage transmission isn't just about preserving the past—it’s also about re-expressing tradition across languages and cultures.</p>

